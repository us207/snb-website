<script>
  function moveRandomDownload(elm) {
    elm.style.position = "absolute";
    elm.style.top = Math.floor(Math.random() * 30 + 20) + "%";
    elm.style.left = Math.floor(Math.random() * 20 + 5) + "%";
  }
  
  
  function moveRandomWrite(elm) {
    elm.style.position = "absolute";
    elm.style.top = Math.floor(Math.random() * 20 + 40) + "%";
    elm.style.left = Math.floor(Math.random() * 10 + 5) + "%";
  }

  function moveRandomBonus(elm) {
    elm.style.position = "absolute";
    elm.style.top = Math.floor(Math.random() * 40 + 20) + "%";
    elm.style.left = Math.floor(Math.random() * 30 + 60) + "%";
  }

  moveRandomDownload(document.querySelector("#rando1"));
  moveRandomBonus(document.querySelector("#rando2"))
  moveRandomWrite(document.querySelector("#rando3"))


</script>
